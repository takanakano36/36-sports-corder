<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏀 BASKETBALL - Fill ＆ Key 2系統同時出力マスター画面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        header {
            height: 48px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        button {
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #334155; }
        .btn-fill { background: #16a34a; border-color: #22c55e; }
        .btn-fill:hover { background: #15803d; }
        .btn-key { background: #475569; border-color: #94a3b8; }
        .btn-key:hover { background: #334155; }
        .btn-side { background: #0284c7; border-color: #38bdf8; }
        .btn-side:hover { background: #0369a1; }

        .dual-container {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 48px);
            background: #000000;
            overflow: hidden;
        }
        .screen-pane {
            flex: 1;
            height: 100%;
            position: relative;
            background: #000000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen-pane.key-pane {
            border-left: 2px solid #334155;
        }
        .pane-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
            z-index: 50;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        .pane-label.fill { color: #4ade80; border-color: #22c55e; }
        .pane-label.key { color: #f1f5f9; border-color: #cbd5e1; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <span>🏀 BASKETBALL Coder</span>
            <span style="color: #94a3b8; font-size: 12px;">| Fill＆Key 2系統同時同期マスター出力</span>
        </div>
        <div class="header-actions">
            <button class="btn-fill" onclick="fullscreenIframe('fill-frame')">🎬 Fill画面のみ全画面化</button>
            <button class="btn-key" onclick="fullscreenIframe('key-frame')">🔲 Key画面のみ全画面化</button>
            <button class="btn-side" onclick="fullscreenDual()">🖥️ 左右同時 (3840x1080) 全画面化</button>
            <button onclick="popoutWindows()">🪟 2つの独立別ウィンドウに分離</button>
        </div>
    </header>

    <div class="dual-container" id="dual-container">
        <!-- 左: Fill (通常カラー映像) -->
        <div class="screen-pane">
            <div class="pane-label fill">● FILL OUTPUT (通常カラー映像)</div>
            <iframe id="fill-frame" src="basketball_overlay.html?mode=fill"></iframe>
        </div>

        <!-- 右: Key (白黒アルファマスク) -->
        <div class="screen-pane key-pane">
            <div class="pane-label key">● KEY OUTPUT (白黒アルファマスク信号)</div>
            <iframe id="key-frame" src="basketball_overlay.html?mode=key"></iframe>
        </div>
    </div>

    <script>
        function fullscreenIframe(frameId) {
            const frame = document.getElementById(frameId);
            if (frame.requestFullscreen) frame.requestFullscreen();
            else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
        }

        function fullscreenDual() {
            const container = document.getElementById('dual-container');
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
        }

        function popoutWindows() {
            const w1 = window.open('basketball_overlay.html?mode=fill', 'overlay_fill', 'width=1920,height=1080');
            const w2 = window.open('basketball_overlay.html?mode=key', 'overlay_key', 'width=1920,height=1080');
            if (!w1 || !w2) {
                alert('ブラウザのポップアップブロックを許可してください。');
            }
        }
    </script>
</body>
</html>
