<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バスケットボール配信画面 (Overlay)</title>
    <link rel="stylesheet" href="css/basketball_overlay.css">
</head>
<body>
    <!-- グリーンバック等のクロマキー調整用背景 -->
    <div id="chromakey-bg" class="chromakey-bg transparent"></div>

    <!-- ==========================================================================
       大得点板 (DISPLAY_MODE: large)
       ========================================================================== -->
    <div id="overlay-large-board" class="hidden">
        <!-- HOMEチーム -->
        <div class="large-team home">
            <div class="team-color-bar team-home-color-bar"></div>
            <!-- 大得点用ロゴマーク -->
            <div class="large-logo-box" id="large-logo-box-home" style="display: none; width: 46px; height: 46px; align-items: center; justify-content: center; margin-right: 16px; margin-left: 25px; background: transparent; border: none; box-shadow: none; flex-shrink: 0;">
                <img id="large-logo-img-home" src="" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            </div>
            <!-- チーム名・タイムアウト縦並びブロック -->
            <div class="large-name-to-block">
                <span class="large-name-container team-home-name-display">HOME</span>
                <div class="timeout-dots" id="home-timeout-dots">
                    <!-- JSで動的生成 -->
                </div>
            </div>
            <div class="large-score team-home-score-display">0</div>
        </div>

        <!-- 中央情報ブロック -->
        <div class="large-center">
            <!-- HOMEチームファウル -->
            <div class="team-foul-box" id="home-fouls-box">
                <span class="team-foul-label">Fouls</span>
                <span class="team-foul-num" id="home-fouls-num">0</span>
                <div class="team-foul-indicator"></div>
            </div>

            <!-- クロック ＆ ピリオド -->
            <div class="clock-period-container">
                <span class="period-display period-display-text">1Q</span>
                <div class="clock-row">
                    <!-- マニュアルクロック -->
                    <span class="game-clock game-clock-text manual-clock-elem">10:00</span>
                    <span class="shot-clock shot-clock-text manual-clock-elem">24</span>
                    
                    <!-- カメラキャプチャクロック (JSで制御) -->
                    <div class="captured-clock-box camera-clock-elem hidden">
                        <img class="captured-clock-img" src="" alt="Captured Clock">
                    </div>
                </div>
            </div>

            <!-- ポゼッション矢印 -->
            <div class="possession-box">
                <span class="poss-arrow" id="home-poss-arrow">◀</span>
                <span class="poss-arrow" id="away-poss-arrow">▶</span>
            </div>

            <!-- AWAYチームファウル -->
            <div class="team-foul-box" id="away-fouls-box">
                <span class="team-foul-label">Fouls</span>
                <span class="team-foul-num" id="away-fouls-num">0</span>
                <div class="team-foul-indicator"></div>
            </div>
        </div>

        <!-- AWAYチーム -->
        <div class="large-team away">
            <div class="team-color-bar team-away-color-bar"></div>
            <!-- 大得点用ロゴマーク -->
            <div class="large-logo-box" id="large-logo-box-away" style="display: none; width: 46px; height: 46px; align-items: center; justify-content: center; margin-right: 25px; margin-left: 16px; background: transparent; border: none; box-shadow: none; flex-shrink: 0;">
                <img id="large-logo-img-away" src="" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            </div>
            <!-- チーム名・タイムアウト縦並びブロック -->
            <div class="large-name-to-block">
                <span class="large-name-container team-away-name-display">AWAY</span>
                <div class="timeout-dots" id="away-timeout-dots">
                    <!-- JSで動的生成 -->
                </div>
            </div>
            <div class="large-score team-away-score-display">0</div>
        </div>
    </div>

    <!-- ==========================================================================
       小得点板 (DISPLAY_MODE: small)
       ========================================================================== -->
    <div id="overlay-small-board" class="hidden">
        <!-- HOMEチーム -->
        <div class="small-team home">
            <div class="small-team-indicator team-home-color-bar"></div>
            <!-- チーム名・タイムアウト縦並びブロック -->
            <div class="small-name-to-block">
                <span class="small-name team-home-name-display">HOME</span>
                <div class="small-timeout-dots" id="small-home-timeout-dots">
                    <!-- JSで動的生成 -->
                </div>
            </div>
            <span class="small-score team-home-score-display">0</span>
        </div>

        <!-- 中央情報 -->
        <div class="small-center">
            <span class="small-period-display period-display-text">1Q</span>
            <div class="small-clock-row">
                <span class="small-game-clock game-clock-text manual-clock-elem">10:00</span>
                <span class="small-shot-clock shot-clock-text manual-clock-elem">24</span>
                
                <!-- カメラキャプチャ時の小クロック -->
                <div class="captured-clock-box camera-clock-elem hidden" style="width: 120px; height: 32px;">
                    <img class="captured-clock-img" src="" alt="Captured Clock">
                </div>
            </div>
        </div>

        <!-- AWAYチーム -->
        <div class="small-team away">
            <div class="small-team-indicator team-away-color-bar"></div>
            <!-- チーム名・タイムアウト縦並びブロック (HOMEと物理順序同一にしてミラー対称化) -->
            <div class="small-name-to-block">
                <span class="small-name team-away-name-display">AWAY</span>
                <div class="small-timeout-dots" id="small-away-timeout-dots">
                    <!-- JSで動的生成 -->
                </div>
            </div>
            <span class="small-score team-away-score-display">0</span>
        </div>
    </div>

    <!-- ==========================================================================
       ランニングスコア (DISPLAY_MODE: ransko)
       ========================================================================== -->
    <div id="overlay-ransko" class="hidden">
        <div id="ransko-tournament-name" class="vs-tournament tournament-display-text" style="min-width: 960px !important; border-bottom: none !important; font-size: 14px; font-weight: 700; text-align: center; background: linear-gradient(180deg, #0f1c30 0%, #030810 100%); border: 1.5px solid #374151; border-radius: 9px 9px 0 0; padding: 6px 36px; color: #cbd5e1;">RUNNING SCORE</div>
        <table class="ransko-table">
            <thead>
                <tr id="ransko-header-row">
                    <!-- JSでヘッダーを動的構築 -->
                </tr>
            </thead>
            <tbody id="ransko-table-body">
                <!-- JSで動的に行を追加 -->
            </tbody>
        </table>
    </div>

    <!-- ==========================================================================
       対戦カード (DISPLAY_MODE: vs)
       ========================================================================== -->
    <div id="overlay-vs" class="hidden">
        <div class="vs-tournament">
            <span class="tournament-display-text">CHAMPIONSHIP</span>
        </div>
        <div class="vs-plate">
            <!-- 左チーム (HOME) -->
            <div class="vs-team vs-left" id="vs-team-left">
                <div class="logo-box" id="vs-logo-box-left">
                    <img class="team-left-logo-display" src="" alt="">
                </div>
                <span class="vs-team-name team-left-name-display">HOME TEAM</span>
            </div>
            
            <!-- VS台形 -->
            <div class="vs-center-box">
                <div class="vs-label">VS</div>
            </div>
            
            <!-- 右チーム (AWAY) -->
            <div class="vs-team vs-right" id="vs-team-right">
                <span class="vs-team-name team-right-name-display">AWAY TEAM</span>
                <div class="logo-box" id="vs-logo-box-right">
                    <img class="team-right-logo-display" src="" alt="">
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
       選手紹介カード (ON AIR用)
       ========================================================================== -->
    <div id="overlay-player-card" class="hidden">
        <div id="player-card">
            <div class="player-team-color-box" id="player-team-color-box">
                <div class="logo-box-wrapper">
                    <img id="player-team-logo" src="" alt="">
                </div>
            </div>
            <div class="player-main-area">
                <div class="player-team-name-strip">
                    <span id="player-team" class="player-team-name">TEAM</span>
                </div>
                <div class="player-details-row">
                    <div class="player-pos-num">
                        <span id="player-position" class="player-pos">G</span>
                        <span id="player-number" class="player-num">0</span>
                    </div>
                    <div class="player-name-box">
                        <span id="player-name-ja" class="player-name-ja">PLAYER NAME</span>
                        <span id="player-comment" class="player-comment"></span>
                    </div>
                    <div class="player-memo-box">
                        <span id="player-memo" class="player-memo"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
       スタメン一覧 (Lineup)
       ========================================================================== -->
    <div id="overlay-lineup" class="hidden">
        <div class="lineup-header" id="lineup-header-container">
            <div class="lineup-logo-box" id="lineup-logo-box">
                <img src="" alt="">
            </div>
            <span class="lineup-header-team-name">TEAM NAME</span>
            <span class="lineup-title-badge">STARTERS</span>
        </div>
        <div class="lineup-rows" id="lineup-rows-container">
            <!-- JSで各選手行を動的生成 -->
        </div>
    </div>

    <!-- ==================== カスタム画像テロップ（Googleスライド画像用） ==================== -->
    <div id="image-telop-wrapper" class="hidden">
        <img id="image-telop-src" src="" alt="">
    </div>

    <!-- 画面右下にホバー時のみ表示される全画面ボタン（スイッチャー出力用） -->
    <button id="btn-fullscreen-toggle" class="fullscreen-btn">全画面表示 (スイッチャー出力)</button>

    <script src="js/basketball_overlay.js"></script>
    <script>
        // フルスクリーン ＆ マウスアイドル非表示制御 (HDMI/スイッチャー出力用)
        (function() {
            const fullscreenBtn = document.getElementById('btn-fullscreen-toggle');
            let mouseIdleTimer = null;

            const isIframe = (window.self !== window.top);
            if (isIframe && fullscreenBtn) {
                fullscreenBtn.style.display = 'none';
                fullscreenBtn.remove();
            } else if (fullscreenBtn) {
                fullscreenBtn.style.display = 'block';
            }

            function resetMouseIdleTimer() {
                document.body.classList.remove('mouse-idle');
                clearTimeout(mouseIdleTimer);
                mouseIdleTimer = setTimeout(() => {
                    document.body.classList.add('mouse-idle');
                }, 3000);
            }

            if (!isIframe) {
                window.addEventListener('mousemove', resetMouseIdleTimer);
                window.addEventListener('click', resetMouseIdleTimer);
                resetMouseIdleTimer();
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`フルスクリーンエラー: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            if (fullscreenBtn && !isIframe) {
                fullscreenBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFullscreen();
                });
            }

            document.addEventListener('dblclick', () => {
                toggleFullscreen();
            });

            document.addEventListener('fullscreenchange', () => {
                if (fullscreenBtn && !isIframe) {
                    if (document.fullscreenElement) {
                        fullscreenBtn.style.setProperty('display', 'none', 'important');
                    } else {
                        fullscreenBtn.style.setProperty('display', 'block');
                    }
                }
            });
            // ウィンドウサイズに応じた1920x1080の完全100%自動フィット制御 (トリミング・見切れ防止)
            function fitWindow() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const scale = Math.min(w / 1920, h / 1080);
                if (scale < 0.999 || scale > 1.001) {
                    document.body.style.transform = `scale(${scale})`;
                    document.body.style.transformOrigin = 'center center';
                    document.body.style.position = 'absolute';
                    document.body.style.left = `${(w - 1920 * scale) / 2}px`;
                    document.body.style.top = `${(h - 1080 * scale) / 2}px`;
                } else {
                    document.body.style.transform = 'none';
                    document.body.style.position = 'relative';
                    document.body.style.left = '0';
                    document.body.style.top = '0';
                }
            }

            window.addEventListener('resize', fitWindow);
            window.addEventListener('load', fitWindow);
            fitWindow();
        })();
    </script>
</body>
</html>
