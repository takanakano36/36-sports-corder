<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スタジアムビジョン得点板 表示画面</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/scoreboard.css">
</head>
<body>
    <!-- 得点板本体（常に1920×1080で作り、ウィンドウの大きさに合わせて拡大・縮小） -->
    <div id="board" class="board waiting">
        <div class="half h"><img class="wm" id="wm-home" alt=""></div>
        <div class="half a"><img class="wm" id="wm-away" alt=""></div>
        <div class="tn" id="tournament"></div>

        <div class="team h">
            <div class="hd">
                <img class="tlogo" id="logo-home" alt="">
                <div class="name" id="name-home"></div>
                <span class="poss" id="poss-home"></span>
            </div>
            <div class="score" id="score-home"></div>
            <div class="to"><span class="to-l">TIMEOUT</span><div class="to-dots" id="to-home"></div></div>
        </div>

        <div class="team a">
            <div class="hd">
                <span class="poss" id="poss-away"></span>
                <div class="name" id="name-away"></div>
                <img class="tlogo" id="logo-away" alt="">
            </div>
            <div class="score" id="score-away"></div>
            <div class="to"><span class="to-l">TIMEOUT</span><div class="to-dots" id="to-away"></div></div>
        </div>

        <div class="center"><table class="qtable" id="qtable"></table></div>

        <div class="ddbar" id="ddbar">
            <span class="down" id="down"></span>
            <span class="sep" id="dd-sep"></span>
            <span class="ball" id="ball">BALL ON<b id="ballon"></b></span>
        </div>

        <!-- 対戦バナー（試合前・ハーフタイムなど）。出している間は得点板の上に全画面で重ねる -->
        <div class="bn-root hidden" id="bn">
            <div class="bn-half h"><img class="wm" id="bn-wm-home" alt=""></div>
            <div class="bn-half a"><img class="wm" id="bn-wm-away" alt=""></div>
            <div class="bn-tn" id="bn-tn"></div>
            <div class="bn-league" id="bn-league"><img id="bn-league-img" alt=""></div>
            <div class="bn-team h"><img class="logo" id="bn-logo-home" alt=""><div class="univ" id="bn-univ-home"></div><div class="nick" id="bn-nick-home"></div></div>
            <div class="bn-team a"><img class="logo" id="bn-logo-away" alt=""><div class="univ" id="bn-univ-away"></div><div class="nick" id="bn-nick-away"></div></div>
            <div class="bn-vs">VS</div>
            <div class="bn-info" id="bn-info">
                <div class="cell" id="bn-cell-date"><span class="val num"><span id="bn-date"></span><small id="bn-dow"></small></span></div>
                <div class="cell" id="bn-cell-venue"><span class="val" id="bn-venue"></span></div>
                <div class="cell" id="bn-cell-ko"><span class="lbl">KICK OFF</span><span class="val num" id="bn-ko"></span></div>
            </div>
        </div>

        <!-- 演出動画（TD・FG）。流れている間は得点板の上に全画面で重ねる -->
        <div class="fx hidden" id="fx"><video id="fx-video" playsinline preload="auto"></video></div>
    </div>
    <script src="js/scoreboard.js"></script>
</body>
</html>
