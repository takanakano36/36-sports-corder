<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野球中継用オーバーレイ (16:9 Full HD)</title>
    <!-- Google Fonts の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/baseball_overlay.css?v=16">
</head>
<body class="chromakey-green">
    <!-- 16:9 フルHDコンテナ -->
    <div id="overlay-container">
        
        <!-- ==================== 1. 小得点モード (左上表示) ==================== -->
        <div id="scoreboard-small" class="hidden">
            <div class="small-overlay-wrapper">


                <!-- イニング漢字表示 (プレート中央上部) -->
                <div class="small-inning-display">
                    <span id="small-inning-text">1回表</span>
                </div>

                <div class="small-main-content">
                    <!-- 左側：チーム名＆スコアのホワイトプレート（上下2段） -->
                    <div class="small-teams-plate">
                        <!-- 上段：AWAY (先攻) -->
                        <div class="small-team-row away-row">
                            <div class="small-team-color-bar" id="small-away-color-bar"></div>
                            <span class="small-team-name team-away-name-display">AWAY TEAM</span>
                            <span class="small-team-score team-away-score-display">0</span>
                        </div>
                        <!-- 下段：HOME (後攻) -->
                        <div class="small-team-row home-row">
                            <div class="small-team-color-bar" id="small-home-color-bar"></div>
                            <span class="small-team-name team-home-name-display">HOME TEAM</span>
                            <span class="small-team-score team-home-score-display">0</span>
                        </div>
                    </div>

                    <!-- 右側：ランナー＆BSO ＆ スピード・球数モジュールブロック -->
                    <div class="small-right-block">
                        <!-- ランナー＆BSOプレート -->
                        <div class="small-bso-runner-plate">
                            <!-- ランナーダイヤモンド背景とインジケーター -->
                            <div class="small-diamond-bg"></div>
                            <div class="base-diamond second" id="runner-2nd"></div>
                            <div class="base-diamond third" id="runner-3rd"></div>
                            <div class="base-diamond first" id="runner-1st"></div>
                            
                            <!-- BSOランプ -->
                            <div class="small-bso-container">
                                <div class="bso-row">
                                    <span class="bso-label text-ball">B</span>
                                    <div class="bso-lamps" id="small-b-lamps">
                                        <div class="bso-lamp lamp-b" id="lamp-b1"></div>
                                        <div class="bso-lamp lamp-b" id="lamp-b2"></div>
                                        <div class="bso-lamp lamp-b" id="lamp-b3"></div>
                                    </div>
                                </div>
                                <div class="bso-row">
                                    <span class="bso-label text-strike">S</span>
                                    <div class="bso-lamps" id="small-s-lamps">
                                        <div class="bso-lamp lamp-s" id="lamp-s1"></div>
                                        <div class="bso-lamp lamp-s" id="lamp-s2"></div>
                                    </div>
                                </div>
                                <div class="bso-row">
                                    <span class="bso-label text-out">O</span>
                                    <div class="bso-lamps" id="small-o-lamps">
                                        <div class="bso-lamp lamp-o" id="lamp-o1"></div>
                                        <div class="bso-lamp lamp-o" id="lamp-o2"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 球速・球数表示エリア (インライン組み込み) -->
                        <div class="small-inline-captures">
                            <div class="capture-inline-box speed-box">
                                <div class="inline-label">SPD</div>
                                <div class="inline-img-container">
                                    <img id="cam-speed-image" src="" alt="" onerror="this.style.opacity='0'">
                                    <span class="capture-placeholder" id="placeholder-speed">---</span>
                                </div>
                            </div>
                            <div class="capture-inline-box pitch-box">
                                <div class="inline-label">PIT</div>
                                <div class="inline-img-container">
                                    <img id="cam-pitch-image" src="" alt="" onerror="this.style.opacity='0'">
                                    <span class="capture-placeholder" id="placeholder-pitch">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 2. 対戦モード (画面中央表示) ==================== -->
        <div id="overlay-vs" class="hidden">
            <div class="vs-tournament">
                <span class="tournament-display-text">大会名</span>
            </div>
            <div class="vs-plate">
                <div class="vs-team vs-away" id="vs-team-away">
                    <div class="logo-box" id="vs-logo-box-away">
                        <img class="team-away-logo-display" src="" alt="" onerror="this.style.opacity='0'">
                    </div>
                    <span class="vs-team-name team-away-name-display">AWAY TEAM</span>
                </div>
                
                <div class="vs-center-box">
                    <div class="vs-label">VS</div>
                </div>
                
                <div class="vs-team vs-home" id="vs-team-home">
                    <span class="vs-team-name team-home-name-display">HOME TEAM</span>
                    <div class="logo-box" id="vs-logo-box-home">
                        <img class="team-home-logo-display" src="" alt="" onerror="this.style.opacity='0'">
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 3. 大得点モード (ランニングスコアボード) ==================== -->
        <div id="scoreboard-large" class="hidden">
            <div class="large-plate">
                <div class="large-board-title" id="large-tournament-title">大会名</div>
                <table class="running-score-board">
                    <thead>
                        <tr>
                            <th class="team-col">TEAM</th>
                            <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                            <th class="stats-col">R</th><th class="stats-col he-col">H</th><th class="stats-col he-col">E</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="large-team-row away-row">
                            <td class="team-col">
                                <div class="large-team-name-wrapper">
                                    <div class="large-team-color" id="large-away-color-bar"></div>
                                    <span class="team-away-name-display">AWAY TEAM</span>
                                </div>
                            </td>
                            <td id="lscore-away-1"></td>
                            <td id="lscore-away-2"></td>
                            <td id="lscore-away-3"></td>
                            <td id="lscore-away-4"></td>
                            <td id="lscore-away-5"></td>
                            <td id="lscore-away-6"></td>
                            <td id="lscore-away-7"></td>
                            <td id="lscore-away-8"></td>
                            <td id="lscore-away-9"></td>
                            <td class="stats-col total-score team-away-score-display">0</td>
                            <td class="stats-col he-col" id="large-away-h">0</td>
                            <td class="stats-col he-col" id="large-away-e">0</td>
                        </tr>
                        <tr class="large-team-row home-row">
                            <td class="team-col">
                                <div class="large-team-name-wrapper">
                                    <div class="large-team-color" id="large-home-color-bar"></div>
                                    <span class="team-home-name-display">HOME TEAM</span>
                                </div>
                            </td>
                            <td id="lscore-home-1"></td>
                            <td id="lscore-home-2"></td>
                            <td id="lscore-home-3"></td>
                            <td id="lscore-home-4"></td>
                            <td id="lscore-home-5"></td>
                            <td id="lscore-home-6"></td>
                            <td id="lscore-home-7"></td>
                            <td id="lscore-home-8"></td>
                            <td id="lscore-home-9"></td>
                            <td class="stats-col total-score team-home-score-display">0</td>
                            <td class="stats-col he-col" id="large-home-h">0</td>
                            <td class="stats-col he-col" id="large-home-e">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ==================== 3.5. 大得点モード (サッカー風) ==================== -->
        <div id="scoreboard-large-soccer" class="hidden">
            <div class="large-soccer-plate">
                <!-- アウェイ（先攻） -->
                <div class="large-soccer-team large-soccer-away">
                    <div class="logo-box">
                        <img class="team-away-logo-display" src="" alt="" onerror="this.style.opacity='0'">
                    </div>
                    <div class="large-soccer-team-info">
                        <span class="large-soccer-team-name-ja team-away-name-display">AWAY TEAM</span>
                        <span class="large-soccer-team-name-en team-away-sub-display">AWAY</span>
                    </div>
                </div>
                
                <!-- 中央台形スコア部 -->
                <div class="large-soccer-center-box">
                    <div class="large-soccer-score-box">
                        <span class="large-soccer-score-num team-away-score-display">00</span>
                    </div>
                    <div class="large-soccer-period-box">
                        <span class="period-display-text" id="large-soccer-inning-text">1回表</span>
                    </div>
                    <div class="large-soccer-score-box">
                        <span class="large-soccer-score-num team-home-score-display">00</span>
                    </div>
                </div>
                
                <!-- ホーム（後攻） -->
                <div class="large-soccer-team large-soccer-home">
                    <div class="large-soccer-team-info">
                        <span class="large-soccer-team-name-ja team-home-name-display">HOME TEAM</span>
                        <span class="large-soccer-team-name-en team-home-sub-display">HOME</span>
                    </div>
                    <div class="logo-box">
                        <img class="team-home-logo-display" src="" alt="" onerror="this.style.opacity='0'">
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 3.8. スタメン一覧 (Lineup) ==================== -->
        <div id="overlay-lineup" class="hidden">
            <div class="lineup-header" id="lineup-header-bg">
                <div class="logo-box" id="lineup-header-logo-box">
                    <img id="lineup-team-logo" src="" alt="" onerror="this.style.opacity='0'">
                </div>
                <span id="lineup-team-name">チーム名</span>
            </div>
            <div class="lineup-list" id="lineup-players-list">
                <!-- JSで動的に追加 -->
            </div>
        </div>

        <!-- ==================== 4. ワンショットテロップ（選手カード） ==================== -->
        <div id="telop-wrapper" class="hidden">
            <div id="player-card" class="telop-content">
                <!-- 左端：チームカラー背景とロゴ -->
                <div class="player-team-color-box" id="player-team-color-box">
                    <div class="logo-box-wrapper">
                        <img id="player-team-logo" src="" alt="" onerror="this.style.opacity='0'">
                    </div>
                </div>
                
                <!-- 右側メインエリア -->
                <div class="player-main-area">
                    <!-- 上部チーム名黒帯 -->
                    <div class="player-team-name-strip">
                        <span id="player-team" class="player-team-name">AWAY TEAM</span>
                    </div>
                    
                    <!-- 下部選手情報 -->
                    <div class="player-details-row">
                        <div class="player-pos-num">
                            <span id="player-position" class="player-pos">投</span>
                            <span id="player-number" class="player-num">1</span>
                        </div>
                        <div class="player-name-box">
                            <span id="player-name-ja" class="player-name-ja">米倉 羽希</span>
                            <span id="player-comment" class="player-comment">エースピッチャー。最速145km/hの直球が武器。</span>
                        </div>
                        
                        <!-- 野球成績表示枠 -->
                        <div class="player-stats-box" id="player-stats-box">
                            <div class="stats-field" id="stats-field-1">
                                <span class="stats-label" id="stats-lbl-1">打率</span>
                                <span class="stats-val" id="stats-val-1">.285</span>
                            </div>
                            <div class="stats-field" id="stats-field-2">
                                <span class="stats-label" id="stats-lbl-2">本塁打</span>
                                <span class="stats-val" id="stats-val-2">2</span>
                            </div>
                            <div class="stats-field" id="stats-field-3">
                                <span class="stats-label" id="stats-lbl-3">打点</span>
                                <span class="stats-val" id="stats-val-3">15</span>
                            </div>
                        </div>

                        <div class="player-memo-box">
                            <span id="player-memo" class="player-memo">3年</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 5. カスタム画像テロップ ==================== -->
        <div id="image-telop-wrapper" class="hidden">
            <img id="image-telop-src" src="" alt="スライドテロップ">
        </div>

    </div>

    <!-- 画面右下にホバー時のみ表示される全画面ボタン（スイッチャー出力用） -->
    <!-- 外付けUSBカメラ クロップテロップ表示枠 -->
    <div id="camera-crop-overlay-wrapper" class="hidden">
        <img id="camera-crop-img" src="" alt="Camera Crop">
    </div>

    <!-- 画面右下にホバー時のみ表示される全画面ボタン（スイッチャー出力用） -->
    <button id="btn-fullscreen-toggle" class="fullscreen-btn">全画面表示 (スイッチャー出力)</button>

    <!-- JavaScript の読み込み -->
    <script src="js/baseball_overlay.js"></script>
    <script>
        (function() {
            const fullscreenBtn = document.getElementById('btn-fullscreen-toggle');
            let mouseIdleTimer = null;

            const isIframe = (window.self !== window.top);
            if (isIframe && fullscreenBtn) {
                fullscreenBtn.style.display = 'none';
                fullscreenBtn.remove();
            } else if (fullscreenBtn) {
                fullscreenBtn.style.display = 'block';
            }

            function resetMouseIdleTimer() {
                document.body.classList.remove('mouse-idle');
                clearTimeout(mouseIdleTimer);
                mouseIdleTimer = setTimeout(() => {
                    document.body.classList.add('mouse-idle');
                }, 3000);
            }

            if (!isIframe) {
                window.addEventListener('mousemove', resetMouseIdleTimer);
                window.addEventListener('click', resetMouseIdleTimer);
                resetMouseIdleTimer();
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }

            if (fullscreenBtn && !isIframe) {
                fullscreenBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFullscreen();
                });
            }

            document.addEventListener('dblclick', () => {
                toggleFullscreen();
            });

            // 1920x1080 16:9 完全自動フィット制御 (トリミング・見切れ防止)
            function fitWindow() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const scale = Math.min(w / 1920, h / 1080);
                if (scale < 0.999 || scale > 1.001) {
                    document.body.style.transform = `scale(${scale})`;
                    document.body.style.transformOrigin = 'center center';
                    document.body.style.position = 'absolute';
                    document.body.style.left = `${(w - 1920 * scale) / 2}px`;
                    document.body.style.top = `${(h - 1080 * scale) / 2}px`;
                } else {
                    document.body.style.transform = 'none';
                    document.body.style.position = 'relative';
                    document.body.style.left = '0';
                    document.body.style.top = '0';
                }
            }

            window.addEventListener('resize', fitWindow);
            window.addEventListener('load', fitWindow);
            fitWindow();
        })();
    </script>
</body>
</html>
